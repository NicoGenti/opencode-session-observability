name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    name: "check (Node ${{ matrix.node-version }})"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # node:sqlite needs no flag from Node 22.13.0; the 22 leg sets it anyway
      # and the 24 leg gets an empty NODE_OPTIONS.
      - name: Check (typecheck + tests)
        run: npm run check
        env:
          NODE_OPTIONS: "${{ matrix.node-version == '22' && '--experimental-sqlite' || '' }}"
      - name: Verify TUI artifact fresh
        run: |
          npm run build:tui
          git diff --exit-code -- dist-tui/tui.mjs
        env:
          NODE_OPTIONS: "${{ matrix.node-version == '22' && '--experimental-sqlite' || '' }}"
      - name: Verify server artifact fresh
        run: |
          npm run build:server
          git diff --exit-code -- dist-server/server.mjs
        env:
          NODE_OPTIONS: "${{ matrix.node-version == '22' && '--experimental-sqlite' || '' }}"
      - name: Verify UI artifact fresh
        run: |
          npm run build:ui
          git diff --exit-code -- dist-ui/
          untracked="$(git ls-files --others --exclude-standard -- dist-ui/)"
          if [ -n "$untracked" ]; then
            echo "dist-ui/ has untracked files that must be committed:"
            echo "$untracked"
            exit 1
          fi
        env:
          NODE_OPTIONS: "${{ matrix.node-version == '22' && '--experimental-sqlite' || '' }}"
      - name: Verify packaged artifact
        run: npm run pack:check
