name: Snyk Code Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk-code:
    name: Snyk Code analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Snyk token
        id: snyk-token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "${SNYK_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SNYK_TOKEN not set — skipping Snyk scan"
          fi

      - name: Run Snyk Code
        id: snyk
        if: steps.snyk-token.outputs.available == 'true'
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --sarif-file-output=snyk-code.sarif

      - name: Sanitize SARIF severity values
        if: steps.snyk-token.outputs.available == 'true' && hashFiles('snyk-code.sarif') != ''
        run: |
          set -euo pipefail

          # Code Scanning rejects non-numeric properties.security-severity
          # values, so drop invalid entries and let GitHub fall back to the
          # rule level and severity metadata.
          tmp=$(mktemp)
          jq '
            walk(
              if type == "object" then
                .properties as $properties
                | if ($properties | type) == "object" then
                    if ($properties | has("security-severity")) then
                      ($properties["security-severity"]) as $severity
                      | if (try ($severity | tonumber) catch null) != null then .
                        else del(.properties["security-severity"])
                        end
                    else .
                    end
                  else .
                  end
              else .
              end
            )
          ' snyk-code.sarif > "$tmp"
          mv "$tmp" snyk-code.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: steps.snyk-token.outputs.available == 'true' && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
